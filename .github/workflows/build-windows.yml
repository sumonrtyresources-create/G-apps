name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller pythonnet clr_loader pillow pillow
      - name: Verify pywebview installation
        run: python -c "import webview; print('pywebview imported from:', webview.__file__)"
      - name: Build EXE with WebView dependencies
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GAppsLauncher --collect-all webview --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms --hidden-import webview.platforms.cef --hidden-import clr_loader --hidden-import pythonnet main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GAppsLauncher-Windows
          path: dist/GAppsLauncher.exe
