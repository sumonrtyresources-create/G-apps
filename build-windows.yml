name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pywebview pyinstaller
      - name: Build EXE (include WebView2 module)
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GAppsLauncher --collect-all webview --hidden-import webview.platforms.edgechromium main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GAppsLauncher-Windows
          path: dist/GAppsLauncher.exe
